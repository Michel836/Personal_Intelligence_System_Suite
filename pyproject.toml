[project]
name = "36tb-intelligence"
version = "1.0.0rc2"
description = "Personal Knowledge Operating System for 36TB of data"
authors = [{name = "Michel LULEV"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["knowledge-management", "local-first", "search", "sqlite", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core runtime: the canonical app (scan / extract / lexical+semantic search /
# reports / API / backup) works with only these. Exact validated versions live
# in ``constraints.txt`` (``pip install -c constraints.txt -e .``).
dependencies = [
    "streamlit>=1.28,<2",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "loguru>=0.7,<1",
    "python-dotenv>=1.0,<2",
    "numpy>=1.25,<3",
    "pandas>=2.1,<3",
    "plotly>=5.17,<8",
    "networkx>=3.2,<4",
    "psutil>=5.9,<8",
    "cachetools>=5.3,<8",
    "requests>=2.31,<3",
    "PyPDF2>=3.0,<4",
    "python-docx>=1.0,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=0.6,<2",
    "odfpy>=1.4,<2",
    "Pillow>=10,<13",
    "starlette>=0.27,<2",
    "uvicorn>=0.24,<1",
    "py7zr>=0.20,<2",
    "rarfile>=4.0,<5",
]

[project.optional-dependencies]
# Local embeddings/LLM (heavy: torch). Install separately on GPU hosts.
ai = [
    "sentence-transformers>=2.2",
    "transformers>=4.36",
    "torch>=2.0",
    "ollama>=0.1.7",
]
# OCR and image/PDF rasterisation (also needs system tesseract/poppler).
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16",
]
# Higher-fidelity extraction and PDF report export.
docs = [
    "pdfplumber>=0.11",
    "markdown2>=2.4",
    "eml_parser>=1.17",
    "weasyprint>=60",
]
cloud = ["dropbox>=11.36"]
postgres = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.12",
]
mcp = ["mcp>=0.1"]
magic = ["python-magic>=0.4.27"]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12",
    "black>=23.11.0",
    "ruff>=0.1.7",
    "mypy>=1.7.1",
    "isort>=5.12",
    "pre-commit>=3.6.0",
]

[project.scripts]
pis = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.intel" = ["*.json"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "T20", # flake8-print
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long, handled by black
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/build_user_guide.py" = ["T201"]
"scripts/quality_gate.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
