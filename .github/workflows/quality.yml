name: Quality Baseline

on:
  push:
    branches: [main, "feat/**", "fix/**", "audit/**", "chore/**"]
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core runtime + dev tools (constrained)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"

      - name: Repository audit
        run: python scripts/audit_repo.py

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Ruff + mypy debt budget (no regressions in changed files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/quality_gate.py --changed "$BASE_SHA"
          else
            python scripts/quality_gate.py
          fi

      - name: Tests
        run: python -m pytest -q

      - name: Patch whitespace gate
        run: git diff --check

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist

      - name: Install the wheel in a clean environment (core deps only)
        run: |
          python -m venv /tmp/pis-wheel
          /tmp/pis-wheel/bin/pip install --upgrade pip
          /tmp/pis-wheel/bin/pip install dist/*.whl
          /tmp/pis-wheel/bin/pis --help > /dev/null

      - name: New-user smoke test (scan → extract → search → report)
        env:
          PIS_DATA_DIR: /tmp/pis-wheel-data
          PIS_EXPORT_DIR: /tmp/pis-wheel-exports
          PIS_NO_AUTO_MIGRATE: "1"
        run: |
          mkdir -p /tmp/corpus
          printf 'Facture ACME total 1250 EUR.\n' > /tmp/corpus/facture.txt
          /tmp/pis-wheel/bin/pis scan /tmp/corpus
          /tmp/pis-wheel/bin/pis extract --limit 10
          /tmp/pis-wheel/bin/pis search facture | grep facture.txt
          /tmp/pis-wheel/bin/pis report build --kind SEARCH \
            --query '{"query":"facture"}' --formats HTML,JSON
